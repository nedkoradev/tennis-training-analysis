  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173f36"/>
      <stop offset="1" stop-color="#09251f"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1876a3"/>
      <stop offset="1" stop-color="#0d507d"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="42%" r="65%">
